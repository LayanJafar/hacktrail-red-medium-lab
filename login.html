<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Haramain Booking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-center">
    <div class="card auth-card">
      <div class="brand">Haramain Express</div>
      <h1>Login</h1>
      <p class="subtitle">Access your booking account</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="student@example.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />

        <button type="submit" class="btn-primary full-width">Login</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();

      localStorage.setItem("user_id", "1001");
      localStorage.setItem("user_email", email);

      window.location.href = "search.html";
    });
  </script>
</body>
</html>
